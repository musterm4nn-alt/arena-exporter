name: Verify extension
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run check:project
