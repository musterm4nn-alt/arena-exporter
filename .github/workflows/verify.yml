name: Verify extension
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run check:project
      - uses: actions/upload-artifact@v4
        with:
          name: arena-exporter-extension-${{ github.run_number }}
          path: |
            dist/Arena-Agent-Exporter-*-chrome.zip
            dist/Arena-Agent-Exporter-*-firefox.zip
          if-no-files-found: error
          retention-days: 14
