name: Verify extension
on:
  push:
    branches: [main, "fix/**"]
    paths-ignore: ["ci/verify-log.txt"]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        shell: bash
        run: |
          set +e
          npm test > /tmp/arena-verify.log 2>&1
          result=$?
          cat /tmp/arena-verify.log
          exit "$result"
      - name: Run lint
        run: npm run lint
      - name: Build extension
        run: npm run build
      - name: Check project
        run: npm run check:project
      - name: Publish failure trace to temporary branch
        if: failure() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p ci
          cp /tmp/arena-verify.log ci/verify-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/verify-log.txt
          git commit -m "ci: preserve failing test output [skip ci]"
          git push origin HEAD:"$GITHUB_REF_NAME"
