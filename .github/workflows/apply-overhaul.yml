name: Apply Arena Exporter production overhaul
on:
  push:
    branches: [overhaul/production-2.2]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[overhaul applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/production-2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply audited overhaul
        run: node tools/apply-overhaul.mjs && node tools/overhaul-fixes.mjs
      - name: Validate extension and site
        id: validate
        continue-on-error: true
        run: |
          set +e
          npm test > validation.log 2>&1
          TEST_STATUS=$?
          npm run site:check >> validation.log 2>&1
          SITE_STATUS=$?
          cat validation.log
          if [ "$TEST_STATUS" -ne 0 ] || [ "$SITE_STATUS" -ne 0 ]; then exit 1; fi
      - name: Publish validation failure
        if: steps.validate.outcome == 'failure'
        run: |
          git config user.name "arena-exporter-overhaul"
          git config user.email "actions@users.noreply.github.com"
          git add validation.log
          git commit -m "Record overhaul validation failure [overhaul applied]"
          git push origin HEAD:overhaul/production-2.2
      - name: Fail validation
        if: steps.validate.outcome == 'failure'
        run: exit 1
      - name: Commit validated result
        if: steps.validate.outcome == 'success'
        run: |
          rm -f tools/apply-overhaul.mjs tools/overhaul-fixes.mjs .github/workflows/apply-overhaul.yml validation.log
          git config user.name "arena-exporter-overhaul"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Arena Exporter 2.2 production overhaul [overhaul applied]"
          git push origin HEAD:overhaul/production-2.2
